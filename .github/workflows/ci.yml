name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  linux-quality:
    name: Linux quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run complete quality gate
        run: npm run check

  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Run tests from canonical upper-case drive path
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $env:CANONICAL_WORKSPACE = $workspace.Substring(0, 1).ToUpperInvariant() + $workspace.Substring(1)
          cmd.exe /d /s /c 'cd /d "%CANONICAL_WORKSPACE%" && node -e "const cwd=process.cwd(); console.log(`Node process.cwd(): ${cwd}`); if (cwd[0] !== cwd[0].toUpperCase()) { console.error(`Expected an upper-case drive letter.`); process.exit(1); }" && npm test'
      # Temporary DEBT-02 diagnostic: keep visible but non-blocking until the upstream defect is fixed.
      - name: Diagnose tests from lower-case drive path
        continue-on-error: true
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $env:LOWERCASE_WORKSPACE = $workspace.Substring(0, 1).ToLowerInvariant() + $workspace.Substring(1)
          cmd.exe /d /s /c 'cd /d "%LOWERCASE_WORKSPACE%" && node -e "const cwd=process.cwd(); console.log(`Node process.cwd(): ${cwd}`); if (cwd[0] !== cwd[0].toLowerCase()) { console.error(`Expected a lower-case drive letter.`); process.exit(1); }" && npm test'
