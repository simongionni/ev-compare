<text x="48" y="80" class="d s56" letter-spacing="-2">Livrea</text>
<text x="48" y="112" class="s16 c2">Ogni veicolo nel confronto indossa un colore che lo segue ovunque. Inchiostro e bianco per l’interfaccia.</text>
<text x="48" y="164" class="s11 w8 c3 caps">INTERFACCIA</text>
