<text x="48" y="352" class="s11 w8 c3 caps">TIPOGRAFIA</text>
<text x="48" y="410" class="d s48" letter-spacing="-1.5">Trova l’auto adatta a te.</text>
<text x="820" y="404" class="s12 c3">Archivo Black · 72/36/24 · cifre grandi</text>
<text x="48" y="448" class="s16 w5">Testo, etichette e azioni in Archivo, pesi 500–800.</text>
<text x="820" y="446" class="s12 c3">Archivo · 12–18</text>
<text x="48" y="500" class="d s40">22 min  €41.500  3</text>
<text x="820" y="492" class="s12 c3">I numeri principali sono il titolo</text>
