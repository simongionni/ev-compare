<rect x="0" y="0" width="1440" height="900" class="paper"/>
<text x="48" y="72" class="s48 w6" letter-spacing="-1">Tavola</text>
<text x="48" y="104" class="s16 c2">Il veicolo come disegno tecnico annotato: inchiostro, linee sottili, cifre monospaziate.</text>
<text x="48" y="160" class="m s11 c3 caps">COLORE</text>
<rect x="48" y="172" width="120" height="72" fill="#F3F0E8" stroke="#CFC9BC"/>
<text x="48" y="264" class="s13 w6">Carta</text>
<text x="48" y="282" class="m s11 c2">#F3F0E8</text>
<text x="48" y="298" class="s11 c3">sfondo</text>
<rect x="180" y="172" width="120" height="72" fill="#FBFAF6" stroke="#CFC9BC"/>
<text x="180" y="264" class="s13 w6">Foglio</text>
<text x="180" y="282" class="m s11 c2">#FBFAF6</text>
<text x="180" y="298" class="s11 c3">superfici</text>
<rect x="312" y="172" width="120" height="72" fill="#161616" stroke="#CFC9BC"/>
<text x="312" y="264" class="s13 w6">Inchiostro</text>
<text x="312" y="282" class="m s11 c2">#161616</text>
<text x="312" y="298" class="s11 c3">testo, linee, azioni</text>
<rect x="444" y="172" width="120" height="72" fill="#4A4741" stroke="#CFC9BC"/>
<text x="444" y="264" class="s13 w6">Grafite</text>
<text x="444" y="282" class="m s11 c2">#4A4741</text>
<text x="444" y="298" class="s11 c3">testo secondario</text>
<rect x="576" y="172" width="120" height="72" fill="#6B675F" stroke="#CFC9BC"/>
<text x="576" y="264" class="s13 w6">Grafite chiara</text>
<text x="576" y="282" class="m s11 c2">#6B675F</text>
<text x="576" y="298" class="s11 c3">note, assi</text>
<rect x="708" y="172" width="120" height="72" fill="#CFC9BC" stroke="#CFC9BC"/>
<text x="708" y="264" class="s13 w6">Filo</text>
<text x="708" y="282" class="m s11 c2">#CFC9BC</text>
<text x="708" y="298" class="s11 c3">divisori</text>
<rect x="840" y="172" width="120" height="72" fill="#C8361B" stroke="#CFC9BC"/>
<text x="840" y="264" class="s13 w6">Vermiglio</text>
<text x="840" y="282" class="m s11 c2">#C8361B</text>
<text x="840" y="298" class="s11 c3">focus, selezione, stato attivo</text>
<text x="990" y="160" class="m s11 c3 caps">SERIE NEI GRAFICI</text>
<line x1="990" y1="186" x2="1060" y2="186" class="" stroke="#161616" stroke-width="2" stroke-dasharray=""/>
<text x="1072" y="190" class="m s11 c2">1 · #161616 · solido</text>
<line x1="990" y1="214" x2="1060" y2="214" class="" stroke="#2251A3" stroke-width="2" stroke-dasharray="7 4"/>
<text x="1072" y="218" class="m s11 c2">2 · #2251A3 · tratteggio</text>
<line x1="990" y1="242" x2="1060" y2="242" class="" stroke="#C27A00" stroke-width="2" stroke-dasharray="10 3 2 3"/>
<text x="1072" y="246" class="m s11 c2">3 · #C27A00 · punto-linea</text>
<line x1="990" y1="270" x2="1060" y2="270" class="" stroke="#A63D7A" stroke-width="2" stroke-dasharray="2 3"/>
<text x="1072" y="274" class="m s11 c2">4 · #A63D7A · punto</text>
<text x="48" y="350" class="m s11 c3 caps">TIPOGRAFIA</text>
<text x="48" y="400" class="s40 w6" letter-spacing="-0.8">Trova l’auto adatta a te.</text>
<text x="560" y="400" class="m s11 c3">IBM Plex Sans 600 · 52/40/28</text>
<text x="48" y="436" class="s15">Testo corrente, etichette e azioni in IBM Plex Sans.</text>
<text x="560" y="436" class="m s11 c3">IBM Plex Sans 400–600 · 12–16</text>
<text x="48" y="476" class="m s24 w6">22 min · +53,9 kWh · €41.500</text>
<text x="560" y="476" class="m s11 c3">IBM Plex Mono: tutte le cifre</text>
<text x="48" y="506" class="m s11 c3 caps">REQUISITI · PREFERENZE · CRITERIO COLLEGATO</text>
<text x="560" y="506" class="m s11 c3">IBM Plex Mono 10–11 maiuscolo</text>
<text x="48" y="566" class="m s11 c3 caps">COMPONENTI</text>
