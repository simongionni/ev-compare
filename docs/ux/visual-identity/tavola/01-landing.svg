<text x="1055" y="422" class="m s14 w6">+</text>
<text x="1071" y="422" class="s13 w5">Viaggi lunghi</text>
<rect x="1187.2" y="400" width="101.2" height="34" class="box"/>
<text x="1201.2" y="422" class="m s14 w6">+</text>
<text x="1217.2" y="422" class="s13 w5">Ricarica</text>
