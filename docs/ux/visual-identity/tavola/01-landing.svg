<text x="923.6" y="466" class="m s14 w6">+</text>
<text x="939.6" y="466" class="s13 w5">Specifiche tecniche</text>
<g><rect x="756" y="508" width="300" height="46" class="ink"/><text x="906" y="536" class="s14 w6 inv" text-anchor="middle">Apri la ricerca per esigenze →</text></g>
